services:
  - type: web
    name: typeform-clone-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////data/typeform_clone.db
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1