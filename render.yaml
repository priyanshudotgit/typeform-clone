services:
  - type: web
    name: typeform-clone-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: LIBSQL_AUTH_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.10